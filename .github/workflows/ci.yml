name: CI

on:
  pull_request:
  push:
    branches: [main]

# Los tests de integración (npm run test:integration) NO se ejecutan aquí:
# escriben en el proyecto de Supabase compartido y comparten límite de
# autenticación. Se lanzan solo a mano.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `-b` es imprescindible: el tsconfig.json raíz solo tiene `references` a los
      # proyectos de .nuxt, y `vue-tsc --noEmit` sin `-b` no revisaba ningún archivo
      # (pasaba siempre en verde). Ver H0-01 en docs/audit/07_CRITICAL_FINDINGS_VALIDATION.md.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build
        env:
          # Valores de relleno: la build solo necesita que existan, no se
          # conecta a nada. Ningún secreto real en CI.
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_KEY: placeholder-anon-key
          SUPABASE_ANON_KEY: placeholder-anon-key
